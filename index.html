<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG com objetos</title>
</head>
<body>
    <h1>RPG com objetos</h1>
    <div>
        <h2>Guerreiro</h2>
        <strong>Thorin</strong>
        <p>Vida: <span id="vidaGuerreiro"></span></p>
        <p>Ataque: <span id="ataqueGuerreiro"></span></p>
        <p>Defesa: <span id="defesaGuerreiro"></span></p>
        <button id="guerreiroAtacar">Atacar</button>
    </div>

    <div>
        <h2>Mago</h2>
        <strong>Gandalfe</strong>
        <p>Vida: <span id="vidaMago"></span></p>
        <p>Ataque: <span id="ataqueMago"></span></p>
        <p>Defesa: <span id="defesaMago"></span></p>
        <button id="magoAtacar">Atacar</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
